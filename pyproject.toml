[project]
name = "edgar-amendments"
version = "0.1.0"
description = "EDGAR amendment intelligence"
requires-python = ">=3.12"

dependencies = [
    "httpx",
    "beautifulsoup4>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100